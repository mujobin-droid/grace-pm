<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grace Hypermarket</title>
<meta name="description" content="Grace Hypermarket project command center">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grace PM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a25" media="(prefers-color-scheme: dark)">
<script>
  // ==== ONE-TIME SETUP: paste your Apps Script web app URL (ends in /exec) between the quotes ====
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwQ8favxmBCVydb_d1JOB1-xQOdSGGlVW7aDlpIce-1cXtnINz8hjQfoTQtoIA2nj8u/exec';
</script>
<style>
  :root { --bg: #f3f4f8; --bar: #ffffff; --text: #141a2e; --muted: #636a7e; --brand: #1f3a8a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1118; --bar: #161a25; --text: #e8eaf2; --muted: #a0a7bb; --brand: #9db2ff; } }
  html, body { margin: 0; height: 100%; background: var(--bar); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  /* The app runs inside a frame, where the phone's safe-area insets are not visible, so pad here. */
  .wrap { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: var(--bar); }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .screen { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: var(--bg); text-align: center; transition: opacity .25s; }
  .screen.hide { opacity: 0; pointer-events: none; }
  .box { max-width: 340px; }
  .logo { width: 88px; height: 88px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: b 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: scale(.8) } 40% { opacity: 1; transform: none } }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--brand); color: var(--bar); cursor: pointer; }
  code { background: var(--bar); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<div class="screen" id="splash">
  <div class="box">
    <img class="logo" src="icons/logo-mark.png" alt="Grace Hypermarket logo">
    <h1>Grace Hypermarket</h1>
    <p id="splashMsg">Opening the command center&hellip;</p>
    <div class="dots" id="dots"><i></i><i></i><i></i></div>
    <div id="splashAct"></div>
  </div>
</div>

<script>
(function () {
  var splash = document.getElementById('splash');
  var msg = document.getElementById('splashMsg');
  var act = document.getElementById('splashAct');
  var dots = document.getElementById('dots');
  var frame = null, slowTimer = null;

  function show(text, buttonLabel, onClick, busy) {
    msg.innerHTML = text;
    dots.style.display = busy ? 'flex' : 'none';
    act.innerHTML = '';
    if (buttonLabel) { var b = document.createElement('button'); b.textContent = buttonLabel; b.onclick = onClick; act.appendChild(b); }
    splash.classList.remove('hide');
  }

  function open() {
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(APP_URL)) {
      show('Setup needed: open <code>index.html</code> and paste your web app URL (it ends in <code>/exec</code>) into <code>APP_URL</code>.');
      return;
    }
    if (!navigator.onLine) { show('You are offline. Connect to the internet to see live project data.', 'Try again', open); return; }
    show('Opening the command center&hellip;', null, null, true);
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.title = 'Grace Hypermarket Command Center';
    frame.allow = 'camera; clipboard-write';
    frame.src = APP_URL;
    frame.onload = function () { clearTimeout(slowTimer); splash.classList.add('hide'); };
    document.getElementById('wrap').appendChild(frame);
    clearTimeout(slowTimer);
    slowTimer = setTimeout(function () {
      show('This is taking longer than usual. Google can be slow on the first open of the day.', 'Reload', open, true);
    }, 15000);
  }

  window.addEventListener('offline', function () { show('You are offline. Changes cannot be saved until you reconnect.', 'Try again', open); });
  window.addEventListener('online', open);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  open();
})();
</script>
</body>
</html>
